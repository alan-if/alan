name: SDK

# Builds the command-line SDK (alan + arun) and packages it.
#
# Deliberately scoped to the SDK only. The graphical/GLK interpreters
# (gararun, glkarun, winarun) have dependencies that are not resolved here and
# are what currently breaks the Jenkins job -- they stay where they are. This
# workflow runs alongside Travis and Jenkins; it replaces nothing yet.
#
# Note the build works out of the box on a runner because Makefile.common only
# includes Makefile.thoni when `uname -n` is thoni64, and Makefile.local is
# untracked. So a plain `make` here is the SDK build.

on:
  push:
    # ci/** so that branches working on CI itself get exercised before they
    # reach master -- otherwise the workflow cannot run until it has already
    # been merged, which is the wrong way round.
    branches: [master, 'ci/**']
  pull_request:
    branches: [master]
  # Note: the "Run workflow" button only appears once this file exists on the
  # default branch, so it is of no help before the first merge.
  workflow_dispatch:

jobs:
  sdk:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
          # macos-latest is Apple Silicon. This is the arm64 build that has
          # been produced locally for years without ever being published.
          - name: macos-arm64
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The regression suite runs through bin/jregr (jregr.jar), so a JDK is
      # required even though nothing in the SDK itself is Java.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The default target builds *and* runs the full test suite. Tests that are
      # marked suspended do not fail it.
      - name: Build and test
        run: make

      - name: Package
        run: make package

      # Name is alan-<version>-<os>-<arch>.tgz, e.g.
      # alan-3.0beta8-linux-x86_64.tgz
      - name: Upload SDK package
        uses: actions/upload-artifact@v5
        with:
          name: alan-sdk-${{ matrix.name }}
          path: alan-*.tgz
          if-no-files-found: error

  # Windows is cross-compiled from Linux with MinGW-w64, which is how it has
  # always been built -- there is no native Windows build here. Dependencies
  # mirror dockers/linux-ci/Dockerfile, minus everything only the GUI/GLK
  # interpreters need.
  windows:
    name: windows-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MinGW-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            mingw-w64-tools mingw-w64-x86-64-dev zip dos2unix
          # The build expects the POSIX-threads flavour.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Build win-iconv
        run: |
          git clone --depth 1 https://github.com/win-iconv/win-iconv.git /tmp/win-iconv
          cd /tmp/win-iconv
          x86_64-w64-mingw32-gcc -O2 -Wall -c win_iconv.c -o win_iconv.o
          ar rcs libwiniconv.a win_iconv.o
          x86_64-w64-mingw32-gcc -shared -o winiconv.dll win_iconv.o \
            -Wl,--out-implib,libwiniconv.dll.a
          echo "WINICONV_ROOT=/tmp/win-iconv" >> "$GITHUB_ENV"

      # A native alan is needed to compile the sample game that goes into the
      # package, so build (but do not test) the Linux binaries first. This
      # mirrors the `ci` target's all -> cross -> cross-package sequence.
      - name: Build native tools
        run: make build

      - name: Cross-build for Windows
        run: make cross

      - name: Package
        run: make cross-package

      - name: Upload SDK package
        uses: actions/upload-artifact@v5
        with:
          name: alan-sdk-windows-x86_64
          path: alan-*.zip
          if-no-files-found: error
